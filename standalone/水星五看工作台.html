function validation(){const p=PROJECTS.find(x=>x.id===state.project);const stages=[['H1 / DEMAND','真实需求是否存在','先按场景抽样真实用户，确认需求的频率与重要性。不要将合成评论比例外推市场。',35,'待真实访谈'],['H2 / EXPERIENCE','方案能否改善体验','比较现有SKU加选购服务与新品样品；实体检测与真人试睡分别记录。',20,'待样品与试睡'],['H3 / ECONOMICS','退款后是否仍有贡献','按成熟退款群组核算商品、平台、履约、投放与售后，并考虑现有产品蚕食。',15,'待真实成本'],['H4 / DELIVERY','能否稳定规模交付','研发确认规格与性能，供应链确认MOQ、质量一致性、交期与现金占用。',10,'待交付核验']];return `${heading('先证明，再迈出下一步。',`${p.name} · ${p.hypothesis}`,button('生成验证计划','generate','flask',true))}<div class="scope-banner">${icon('info')}以下为验证计划演示，尚未开展真实实验；进度为界面示意，不代表项目完成情况。</div><div class="filter-row">${PROJECTS.map(x=>`<button class="button ${x.id===p.id?'primary':''}" data-project="${x.id}">${x.name}</button>`).join('')}</div><div class="experiment-grid">${stages.map(([s,t,d,n,status],i)=>`<article class="experiment"><div class="stage">${s}</div><h3>${t}</h3><p>${d}</p><div class="experiment-progress"><i style="width:${n}%"></i></div><div class="experiment-footer"><span>${status}</span><button class="text-btn" data-hypothesis="${i}">设计实验 ${icon('arrow')}</button></div></article>`).join('')}</div><section class="panel"><div class="panel-head"><h2>验证之前，明确成功与停止条件</h2><span class="tag gold">需要真实证据</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>验证内容</th><th>主指标</th><th>必须记录</th></tr></thead><tbody><tr><td>需求与体验</td><td>按目标场景预注册</td><td>样本、对照、顺序与观察窗口</td></tr><tr><td>市场试销</td><td>成熟退款后增量贡献</td><td>流量分组、折扣、退货与蚕食</td></tr><tr><td>供应交付</td><td>质量一致性与履约能力</td><td>样品版本、MOQ、交期与现金</td></tr></tbody></table></div></section>`;}

function modelContent(){return `<section class="panel"><div class="panel-head"><h2>模型、上下文与运行边界</h2><span class="tag">可复现模拟</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>配置</th><th>当前值</th><th>说明</th></tr></thead><tbody><tr><td>对话生成</td><td>${state.config?.modelConfigured?e(state.config.modelLabel||'已配置外部模型'):'内置策略模板与意图解析'}</td><td>未配置大模型时不宣称开放域智能推理</td></tr><tr><td>需求模型</td><td>岭回归 · 3个机会独立拟合</td><td>每个60条训练 / 20条留出，均为合成样本</td></tr><tr><td>特征</td><td>投放 研发 售价 需求 成本</td><td>退货率在单位经济性中计算</td></tr><tr><td>工具调用预算</td><td>每次任务最多8次</td><td>单工具15秒超时，失败保留可用结果</td></tr><tr><td>上下文与状态</td><td>品类 周期 当前机会 场景 最近6轮</td><td>浏览器保存会话与报告，服务端请求隔离</td></tr><tr><td>安全边界</td><td>只读工具与服务端白名单</td><td>无任意脚本 无调价下单 无浏览器密钥</td></tr></tbody></table></div><p class="model-note">合成留出集MAE ${simulation.model.mae}千件，仅说明拟合合成规律的误差，不证明真实业务准确度。预算大幅增加可能超出训练分布，正式使用需用授权历史数据重新训练、校准并独立回测。</p></section><section class="panel single-panel"><div class="panel-head"><h2>扩展配置示例</h2><small>仅示例，无真实密钥</small></div><pre class="code-block">${e(JSON.stringify({MCP_SERVERS_JSON:[{id:'research',name:'授权研究服务',url:'https://your-trusted-host.example/mcp',allowedTools:['search_evidence'],tokenEnv:'RESEARCH_MCP_TOKEN'}],MCP_ALLOWED_HOSTS:'your-trusted-host.example',MODEL_ENDPOINT:'https://your-trusted-host.example/generate',MODEL_TOKEN:'server-side-secret'},null,2))}</pre><p class="model-note">外部推理服务接收结构化任务、选定Skill和演示上下文，返回 { "text": "建议正文" }。接口密钥仅由服务端环境变量提供。外部调用在配置后启用，默认不传输真实企业数据。</p></section>`;}
function copilot(){const contextPage=['dashboard','insights','portfolio','validation'].includes(state.page)?state.page:'insights';const questions={dashboard:['下一阶段，哪些机会值得优先验证？','收入增长时，如何判断是否应该加大投放？','生成一份管理层战略决策简报'],insights:['分析当前监测信号，给出五看研究报告','品牌声量上升，应如何验证业务价值？','比较客户需求变化与产品迭代方向'],portfolio:['预算300万，成本上涨10%，比较机会组合','如果需求下降15%，如何优先保护现金？','售价提高5%，退货率上升2个百分点会怎样？'],validation:['为当前机会设计真实用户验证计划','如何区分选购服务与新品的效果？','试销之前，哪些成本与条件需要确认？']}[contextPage];const messages=state.chats[contextPage]||[];return `<aside class="copilot ${state.copilotOpen?'open':''}" aria-label="战略智能副驾驶"><div class="copilot-head"><span class="ai-icon">${icon('spark')}</span><div><div class="copilot-title">战略副驾驶</div><small>YOUR STRATEGY COPILOT</small></div><button class="text-btn" data-action="new-chat" title="新建当前页对话">${icon('plus')}</button><button class="text-btn mobile-copilot" data-action="copilot" aria-label="关闭副驾驶">${icon('close')}</button></div><div class="copilot-caption">${state.config?.modelConfigured?(e(state.config.modelLabel||'外部模型')+' · 仅模拟数据'):'未接入大模型 · 指标问答 / 规则模拟 / 模板报告'}</div>${!messages.length?`<div class="welcome-card"><div class="eyebrow">THINK FORWARD, TOGETHER</div><h3>${contextPage==='portfolio'?'如果改变一个假设，<br>会出现怎样的机会？':'从一个好问题，<br>开始下一步判断。'}</h3><p>${contextPage==='portfolio'?'告诉我预算、成本或需求的变化，<br>我会比较组合与产品、市场策略。':'我会关联经营与监测信号，<br>给出建议、依据和需要验证的事。'}</p></div><div class="suggest-label">你可以这样开始</div><div class="prompt-list">${questions.map(q=>`<button class="prompt" data-prompt="${e(q)}">${q}${icon('arrow')}</button>`).join('')}</div>`:''}<div class="chat-messages" id="chat-messages">${messages.map(m=>`<div class="chat-message ${m.role}"><div class="message-meta"><span>${m.role==='user'?'你':m.engine==='deepseek-demo'?'战略副驾驶 · DeepSeek':'战略副驾驶 · 演示引擎'}</span><span>${m.role==='assistant'?(m.reportId?(m.engine==='deepseek-demo'?'模型报告已生成':'模板报告已生成'):['deepseek-demo','demo-workflow+model-adapter'].includes(m.engine)?'大模型回答':'指标问答 / 能力说明'):''}</span></div>${m.role==='assistant'?markdownHTML(m.text):e(m.text)}${m.reportId?`<div class="message-actions"><button data-action="open-report" data-id="${m.reportId}">阅读报告 ↗</button><button data-action="share-report" data-id="${m.reportId}">分享</button><button data-action="show-trace">执行过程</button></div>`:m.engine==='deepseek-demo'?`<div class="message-actions"><button data-action="show-trace">执行过程</button><span>${m.usage?.total_tokens||0} tokens</span></div>`:''}</div>`).join('')}</div>${state.error?`<div class="chat-error">${e(state.error)}</div>`:''}${state.busy?`<div class="running"><span class="spinner"></span>正在处理问题并核对口径…<button class="text-btn" style="margin-left:auto" data-action="cancel-run">取消</button></div>`:''}<div class="composer-area"><div class="context-tag">${icon('link')}已关联：${PAGE[contextPage][0]} · ${{all:'全品类',pillow:'枕芯',quilt:'被芯'}[state.category]}</div><form class="composer" id="chat-form"><textarea id="chat-input" aria-label="向战略副驾驶提问" placeholder="提出业务问题，或输入 What if…" maxlength="4000" ${state.busy?'disabled':''}></textarea><div class="composer-bottom"><span>演示数据 · ${state.config?.modelConfigured?'DeepSeek · 仅Demo':'大模型未接入'}</span><button class="send-btn" type="submit" ${state.busy?'disabled':''} aria-label="发送问题">${icon('arrowup')}</button></div></form><div class="copilot-footer">建议需真实证据验证，重要决策由管理层判断。</div></div></aside>`;}
function render(){try{const content={dashboard,insights,portfolio,validation,library,private:privatePage,harness}[state.page]();document.getElementById('app').innerHTML=sidebar()+`<div class="shell">${topbar()}<div class="main-layout"><main class="workspace ${state.page==='harness'?'wide':''}" id="workspace">${content}</main>${state.page==='harness'?'':copilot()}</div></div>`;const chat=document.getElementById('chat-messages');if(chat)chat.scrollTop=chat.scrollHeight;}catch(err){document.getElementById('app').innerHTML=`<main style="padding:40px"><div class="error-boundary">页面加载失败：${e(err.message)}<br><button class="button" onclick="location.reload()">重新载入</button></div></main>`;console.error(err);}}
function go(page){if(!PAGE[page])return;state.page=page;state.menuOpen=false;state.error='';if(location.hash!==`#${page}`)history.replaceState(null,'',`#${page}`);render();window.scrollTo(0,0);}
function findReport(id){return state.reports.find(r=>r.id===id);}
function modal(title,body,small=false){const previous=document.activeElement;currentModal={previous};document.getElementById('modal-root').innerHTML=`<div class="overlay" data-overlay="true"><section class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-label="${e(title)}" tabindex="-1"><div class="modal-head"><h2>${e(title)}</h2><button class="close-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></div>${body}</section></div>`;document.querySelector('.modal')?.focus();}
function closeModal(){document.getElementById('modal-root').innerHTML='';currentModal?.previous?.focus();currentModal=null;}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openReport(id){const r=findReport(id);if(!r)return toast('没有找到报告，请重新生成');modal(r.title,`<div class="report-toolbar">${button('导出HTML','download-html','download',false,`data-id="${r.id}"`)}${button('导出Markdown','download-md','download',false,`data-id="${r.id}"`)}${button('分享阅读链接','share-report','share',true,`data-id="${r.id}"`)}</div><article class="report-reader">${markdownHTML(r.markdown)}</article>`);}
const encode=value=>{const bytes=new TextEncoder().encode(JSON.stringify(value));return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
function decode(value){if(value.length>100000)throw Error('报告快照过大');const raw=value.replace(/-/g,'+').replace(/_/g,'/');const obj=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw),x=>x.charCodeAt(0))));if(typeof obj.title!=='string'||typeof obj.markdown!=='string'||obj.markdown.length>40000)throw Error('报告格式无效');return obj;}
async function shareReport(id){const r=findReport(id);if(!r)return toast('没有找到报告');if(location.protocol==='file:'){modal('分享演示报告',`<p class="modal-text">独立HTML正在本地打开，无法生成可远程访问的网址。可导出HTML文件分享；启动源码服务或使用在线Demo后，可生成阅读快照链接。</p>${button('导出HTML报告','download-html','download',true,`data-id="${r.id}"`)}`,true);return;}const url=location.origin+location.pathname+'#report='+encode(r);modal('分享报告快照',`<p class="modal-text">链接包含当前演示报告的完整快照。接收人需具备本站访问权限；可单独分享导出的HTML文件。此操作不会更改站点权限。</p><label class="field-label" for="share-url">阅读链接</label><input class="field" id="share-url" readonly value="${e(url)}"><div class="modal-actions">${button('导出HTML','download-html','download',false,`data-id="${r.id}"`)}${button('复制链接','copy-share','share',true)}</div>`,true);}
async function runQuestion(message,skillId){if(state.busy)return;const page=['dashboard','insights','portfolio','validation'].includes(state.page)?state.page:'insights';const chats=state.chats[page]||[];const payload={message,page,context:{category:state.category,period:state.period,lens:state.lens,project:state.project},scenario:state.scenario,skillId,skills:allSkills(),history:chats.slice(-6).map(x=>({role:x.role,text:x.text}))};state.chats[page]=[...chats,{role:'user',text:message}].slice(-16);state.busy=true;state.error='';state.trace=[];controller=new AbortController();render();try{let result;if(state.backend){const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});const data=await res.json();if(!res.ok)throw Error(data.error||'任务执行失败');result=data;}else{const harness=new Harness({skills:allSkills(),onEvent:ev=>{state.trace.push(ev);}});await new Promise(resolve=>setTimeout(resolve,160));result=await harness.run(payload,controller.signal);}if(controller.signal.aborted)throw new DOMException('任务已取消','AbortError');state.trace=result.trace;state.reports=[result.report,...state.reports].slice(0,15);state.chats[page].push({role:'assistant',text:result.answer,reportId:result.report.id});if(result.simulation){simulation=result.simulation;state.scenario={...simulation.scenario};state.selectedPlan=simulation.recommended;}persist();toast('报告已生成，可阅读、导出或分享');}catch(err){state.error=err.name==='AbortError'?'任务已取消，未保存未完成报告。':err.message;state.trace.push({at:Date.now(),type:'error',label:state.error,status:'error'});}finally{state.busy=false;controller=null;render();}}
async function checkBackend(notify=false){if(PUBLIC_STATIC){state.backend=false;state.config={app:'mercury-workbench',deployment:'github-pages',modelConfigured:false,remoteTools:[],remoteServers:[]};if(notify)toast('公开演示使用浏览器内置harness，不连接云端或真实模型');return;}if(location.protocol==='file:'){if(notify)toast('独立HTML使用浏览器harness；启动源码可启用服务端API与MCP');return;}try{const res=await fetch('/api/config',{signal:AbortSignal.timeout(12000)});if(!res.ok)throw Error('服务不可用');const cfg=await res.json();if(cfg.app!=='mercury-workbench')throw Error('不是工作台服务');state.backend=true;state.config=cfg;if(notify)toast('服务端连接正常，已刷新MCP与模型状态');}catch{state.backend=false;state.config=null;if(notify)toast('未发现服务端，当前使用浏览器内置harness');}if(state.page==='harness')render();else{const label=document.querySelector('.composer-bottom>span');if(label)label.textContent='演示数据 · '+(state.config?.modelConfigured?'DeepSeek · 仅Demo':state.backend?'规则harness · 未接入模型':'本地harness');}}
async function invokeTool(name,args,remote=false){if(remote){if(!state.backend)throw Error('外部MCP需要服务端');const res=await fetch('/api/mcp/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,arguments:args}),signal:AbortSignal.timeout(20000)});const data=await res.json();if(!res.ok)throw Error(data.error||'外部工具失败');return data;}if(state.backend){const res=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:Date.now(),method:'tools/call',params:{name,arguments:args}})});const data=await res.json();if(data.error||data.result?.isError)throw Error(data.error?.message||data.result?.content?.[0]?.text||'工具失败');return data.result;}const h=new Harness();return h.tool(name,args);}
function toolDialog(name,remote=false){const desc=remote?state.config?.remoteTools.find(t=>t.name===name):TOOLS.find(t=>t.name===name);modal('调用工具 '+name,`<p class="modal-text">${e(desc?.description||'已授权只读工具')}<br>输入JSON参数后执行，结果会真实调用当前注册的工具处理器。</p><textarea id="tool-args" aria-label="工具JSON参数">${name==='portfolio.simulate'?e(JSON.stringify(state.scenario,null,2)):'{}'}</textarea><div class="modal-error" id="tool-error"></div><div class="modal-actions"><button class="button primary" data-invoke="${e(name)}" data-remote="${remote}">${icon('play')}执行只读调用</button></div><pre id="tool-result" class="code-block" style="display:none;margin-top:15px"></pre>`,true);}
function showShared(r){document.getElementById('app').innerHTML=`<div class="report-only"><div class="page-heading"><div><div class="eyebrow">MERCURY / SHARED SNAPSHOT</div><h1>研究报告快照</h1><p>阅读链接内的演示内容 · 非实时企业数据</p></div><button class="button" id="return-workbench">${icon('arrow')}进入工作台</button></div><section class="panel"><div class="report-toolbar"><button class="button" id="shared-download">${icon('download')}导出HTML</button></div><article class="report-reader">${markdownHTML(r.markdown)}</article></section></div>`;document.getElementById('return-workbench').onclick=()=>{history.replaceState(null,'','#dashboard');render();checkBackend();};document.getElementById('shared-download').onclick=()=>download(r.title+'.html',reportHTML(r),'text/html;charset=utf-8');}
document.addEventListener('click',async ev=>{const el=ev.target.closest('button,[data-overlay]');if(!el)return;if(el.dataset.overlay&&ev.target===el){closeModal();return;}if(el.dataset.page){go(el.dataset.page);return;}if(el.dataset.project){state.project=el.dataset.project;go('validation');return;}if(el.dataset.lens){state.lens=el.dataset.lens;render();return;}if(el.dataset.plan){state.selectedPlan=el.dataset.plan;render();return;}if(el.dataset.prompt){runQuestion(el.dataset.prompt);return;}if(el.dataset.topic!==undefined){const t=getSignals(state).topics[+el.dataset.topic];runQuestion(`请分析“${t[0]}”：${t[1]}，输出五看洞察与行动建议。`);return;}if(el.dataset.signal!==undefined){const s=getMetrics(state).changes[+el.dataset.signal];runQuestion(`请分析“${s.title}”，给管理层战略决策建议和需要补充的证据。`);return;}if(el.dataset.hypothesis!==undefined){runQuestion(`请为${PROJECTS.find(x=>x.id===state.project).name}的第${+el.dataset.hypothesis+1}项假设设计验证计划。`);return;}if(el.dataset.harnessTab){state.harnessTab=el.dataset.harnessTab;render();return;}if(el.dataset.toggleSkill){const s=allSkills().find(x=>x.id===el.dataset.toggleSkill);s.enabled=!s.enabled;persist();render();return;}if(el.dataset.testTool){toolDialog(el.dataset.testTool);return;}if(el.dataset.remoteTool){toolDialog(el.dataset.remoteTool,true);return;}if(el.dataset.invoke){const error=document.getElementById('tool-error');try{const args=JSON.parse(document.getElementById('tool-args').value);el.disabled=true;error.textContent='正在调用…';const result=await invokeTool(el.dataset.invoke,args,el.dataset.remote==='true');const out=document.getElementById('tool-result');out.style.display='block';out.textContent=JSON.stringify(result,null,2);error.textContent='调用成功';}catch(err){error.textContent=err.message;}finally{el.disabled=false;}return;}if(el.dataset.source){const s=SOURCES.find(x=>x.id===el.dataset.source);modal(s.name,`<p class="modal-text">${s.description}</p><pre class="code-block">${e(JSON.stringify(s,null,2))}</pre>`,true);return;}
  const a=el.dataset.action,id=el.dataset.id;if(!a)return;
  if(a==='close-modal')closeModal();else if(a==='menu'){state.menuOpen=!state.menuOpen;render();}else if(a==='copilot'){state.copilotOpen=!state.copilotOpen;render();}else if(a==='generate'){runQuestion(state.page==='portfolio'?'请基于当前参数比较三种机会组合，输出新品研发、产品迭代与市场投放策略。':state.page==='validation'?`请为${PROJECTS.find(x=>x.id===state.project).name}生成完整机会验证计划。`:state.page==='dashboard'?'请生成管理层战略简报，分析核心指标、战略取舍和下一步建议。':'请围绕当前监测范围生成完整五看洞察报告。');}else if(a==='simulate'){simulation=simulate(state.scenario);state.selectedPlan=state.scenario.objective;persist();render();toast('三种组合已更新；结果为合成模型场景模拟');}else if(a==='reset-scenario'){state.scenario={...DEFAULT_SCENARIO};simulation=simulate(state.scenario);state.selectedPlan='balanced';persist();render();}else if(a==='open-report')openReport(id);else if(a==='download-html'||a==='download-md'){const r=findReport(id);if(r)download(r.title+(a==='download-html'?'.html':'.md'),a==='download-html'?reportHTML(r):r.markdown,a==='download-html'?'text/html;charset=utf-8':'text/markdown;charset=utf-8');}else if(a==='share-report')shareReport(id);else if(a==='copy-share'){const input=document.getElementById('share-url');try{await navigator.clipboard.writeText(input.value);toast('报告阅读链接已复制');}catch{input.focus();input.select();toast('请复制已选中的阅读链接');}}else if(a==='new-chat'){const p=['dashboard','insights','portfolio','validation'].includes(state.page)?state.page:'insights';state.chats[p]=[];state.error='';persist();render();}else if(a==='cancel-run'){controller?.abort();}else if(a==='show-trace'){state.harnessTab='runs';go('harness');}else if(a==='check-backend')checkBackend(true);else if(a==='download-trace')download('mercury-run-trace.json',JSON.stringify(state.trace,null,2),'application/json');else if(a==='model-info'){modal('模型与经济性口径',`<p class="modal-text">${simulation.model.warning}</p><pre class="code-block">${e(JSON.stringify({model:simulation.model,parameters:simulation.scenario,formulas:{netRevenue:'预测发货量 × (1 − 退货率) × 净单价',contribution:'净收入 − 商品成本 − 退货不可售损耗 − 正逆向履约 − 平台费用 − 售后 − 投放 − 研发',reserve:'总预算 × 各组合预备金比例'}},null,2))}</pre><p class="modal-text" style="margin-top:15px">结果未含税、营运资金、SKU蚕食与长期品牌效应。训练覆盖每机会研发和投放各约0—100万元，超过时属于外推。</p>`);}else if(a==='metric-info'){const d=metricDefinition(el.dataset.metric||'channels',state),m=getMetrics(state);modal(d.label+' · 指标口径',`<div class="wf-statebar"><span>${e(d.scope)}</span><span>来源 ${d.source}</span><span>固定合成快照</span></div><div class="wf-definition"><div><span>计算公式</span><p>${e(d.formula)}</p></div><div><span>解释与限制</span><p>${e(d.detail)}</p></div><div><span>快照时间</span><p>${e(d.snapshot)}</p></div></div>${d.id==='trend'?`<p class="model-note">上方净收入：${m.revenue}万元；${state.period==='quarter'?'12周合计':'最后4周合计'}。图表始终展示12周。</p><table class="data-table"><thead><tr><th>周</th><th>净收入 / 万元</th><th>合成参考值 / 万元</th></tr></thead><tbody>${m.trend.map((r,i)=>`<tr><td>W${i+1}${i>=8?' · 近4周':''}</td><td>${r.revenue}</td><td>${r.target}</td></tr>`).join('')}</tbody></table>`:''}`,false);}else if(a==='space')modal('新品战略研究室',`<p class="modal-text">当前Demo只有一个演示空间，包含战略、五看研究、机会组合与验证。空间内容保存在当前浏览器，尚未连接企业身份、真实数据和协作权限。</p>${button('进入运行中心','open-harness','sliders',true)}`,true);else if(a==='open-harness'){closeModal();go('harness');}else if(a==='notifications')modal('研究提醒',`<div class="topic"><span class="dot"></span><div><h3>枕头适配：需要真实需求证据</h3><p>真人访谈与试睡尚未开展。</p></div></div><div class="topic"><span class="dot" style="background:#b49766"></span><div><h3>外部数据：尚未连接</h3><p>前往运行中心查看MCP与数据配置。</p></div></div><p class="modal-text" style="margin-top:15px">以上为演示提醒，不是企业实际任务通知。</p>`,true);else if(a==='view-skill'){const s=allSkills().find(x=>x.id===id);modal(s.name,`<pre class="code-block">${e(skillDocument(s))}</pre><div class="modal-actions">${button('下载SKILL.md','download-skill','download',true,`data-id="${s.id}"`)}</div>`);}else if(a==='download-skill'){const s=allSkills().find(x=>x.id===id);download(s.id+'-SKILL.md',skillDocument(s),'text/markdown;charset=utf-8');}else if(a==='run-skill'){const s=allSkills().find(x=>x.id===id);if(!s.enabled)return toast('请先启用该Skill');go(s.id==='portfolio-whatif'?'portfolio':s.id==='opportunity-validation'?'validation':'insights');runQuestion(`请使用${s.name}分析当前演示业务，给出明确建议、依据与验证计划。`,s.id);}else if(a==='import-skill'){modal('导入SKILL.md',`<p class="modal-text">加载名称、说明、工具白名单和Markdown指令。仅允许已注册的只读工具，不运行上传脚本；自由文本指令可交给已配置的模型适配器。</p><input type="file" id="skill-file" accept=".md,text/markdown,text/plain" aria-label="选择Skill文件"><textarea id="skill-document" style="margin-top:15px" aria-label="Skill Markdown内容">${e('---\nname: bedding-opportunity\ndescription: 分析床品需求与机会并生成研究建议\nallowed-tools: metrics.query signals.monitor evidence.search\n---\n先核对数据范围，再比较客户需求、内部能力与替代方案。将未验证的结论标为假设，输出下一步验证计划。')}</textarea><div class="modal-error" id="skill-error"></div><div class="modal-actions">${button('校验并导入','confirm-skill','plus',true)}</div>`);}else if(a==='confirm-skill'){try{const s=parseSkill(document.getElementById('skill-document').value,state.config?.remoteTools||[]);if(allSkills().some(x=>x.id===s.id))throw Error('Skill名称已存在');state.customSkills.push(s);persist();closeModal();render();toast('Skill已校验并导入');}catch(err){document.getElementById('skill-error').textContent=err.message;}}else if(a==='discover-mcp'){try{const result=state.backend?await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list'})}).then(r=>r.json()):{mode:'browser-local',tools:TOOLS};modal('MCP工具发现结果',`<pre class="code-block">${e(JSON.stringify(result,null,2))}</pre>`);}catch(err){toast(err.message);}}else if(a==='save-notes'){state.privateNotes=document.getElementById('private-notes').value;persist();toast('研究笔记已保存在本浏览器');}else if(a==='show-reports'){if(state.reports.length)openReport(state.reports[0].id);else toast('尚未生成报告，请先向副驾驶提问');}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='chat-form'){ev.preventDefault();const text=document.getElementById('chat-input').value.trim();if(text)runQuestion(text);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&currentModal)closeModal();if(ev.target.id==='chat-input'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();const text=ev.target.value.trim();if(text)runQuestion(text);}if(ev.key==='Tab'&&currentModal){const focusable=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal a,.modal select')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(ev.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('modal'))){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='period-filter'){state.period=el.value;render();}else if(el.id==='category-filter'){state.category=el.value;render();}else if(el.id==='objective-select'){state.scenario.objective=el.value;}else if(el.id==='skill-file'&&el.files[0]){if(el.files[0].size>20000)return document.getElementById('skill-error').textContent='文件不能超过20KB';document.getElementById('skill-document').value=await el.files[0].text();}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.range){const k=el.dataset.range;state.scenario[k]=Number(el.value);document.getElementById('value-'+k).textContent=el.value+' '+(k==='budget'?'万元':k==='returnChange'?'pp':'%');}else if(el.id==='source-search'){state.search=el.value;const pos=el.selectionStart;render();const field=document.getElementById('source-search');field.focus();field.setSelectionRange(pos,pos);}});
const reviewV11=installV11({state,base:{sidebar,dashboard,insights,portfolio,validation,library,harness,filters},icon,button,heading,modal,closeModal,toast,render,go,allSkills,persist,download,markdownHTML,reportHTML,getSimulation:()=>simulation,setSimulation:value=>{simulation=value;}});
const previousBackendCheck=checkBackend;
sidebar=reviewV11.sidebar;dashboard=reviewV11.dashboard;insights=reviewV11.insights;portfolio=reviewV11.portfolio;validation=reviewV11.validation;library=reviewV11.library;harness=reviewV11.harness;shareReport=reviewV11.shareReport;openReport=reviewV11.openReport;runQuestion=reviewV11.runQuestion;
checkBackend=async notify=>{await previousBackendCheck(notify);await reviewV11.connect();};
window.addEventListener('hashchange',()=>{const value=location.hash.slice(1);closeModal();if(value.startsWith('report=')){render();toast('旧版正文快照链接已停用，请重新生成受控编号链接或导出文件。');}else if(PAGE[value]){state.page=value;render();checkBackend();}});
const initial=location.hash.slice(1);if(initial.startsWith('report=')){render();toast('旧版正文快照链接已停用，请重新生成受控编号链接或导出文件。');checkBackend();}else{if(PAGE[initial])state.page=initial;render();checkBackend();}
</script></body>
